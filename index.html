<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>专属私密空间</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="私密空间">
    <link rel="apple-touch-icon" href="https://supabase.com/favicon/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #16161f;
            --accent-taoran: #3ecf8e;
            --accent-qiqi: #ff758c;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --input-bg: #1e1e2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow: hidden;
        }

        header {
            padding: 16px 20px;
            background: rgba(22, 22, 31, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #000;
        }

        .avatar.taoran { background: var(--accent-taoran); }
        .avatar.qiqi { background: var(--accent-qiqi); }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3ecf8e;
            box-shadow: 0 0 8px #3ecf8e;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .sender-name {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .message-row.me .bubble {
            background: linear-gradient(135deg, #3ecf8e, #2bbd7e);
            color: #0d0d12;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .message-row.other .bubble {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .time-tag {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            padding: 0 4px;
        }

        footer {
            padding: 12px 16px;
            background: rgba(22, 22, 31, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            background: var(--input-bg);
            border-radius: 22px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            padding: 8px 0;
        }

        button {
            background: var(--accent-taoran);
            color: #0d0d12;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s active;
        }

        button:active {
            transform: scale(0.95);
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>

    <script>
        (function(document, navigator, standalone) {
            if ((standalone in navigator) && navigator[standalone]) {
                var c2g;
                document.addEventListener('click', function(e) {
                    c2g = e.target;
                    while (c2g.nodeName !== 'A' && c2g.nodeName !== 'BODY') {
                        c2g = c2g.parentNode;
                    }
                    if ('href' in c2g && (c2g.href.indexOf('http') || c2g.href.indexOf(document.location.host) !== -1)) {
                        e.preventDefault();
                        document.location.href = c2g.href;
                    }
                }, false);
            }
        })(document, window.navigator, 'standalone');
    </script>
</head>
<body>

    <header>
        <div class="user-badge">
            <div id="user-avatar" class="avatar">然</div>
            <span id="user-display-name">身份确认中...</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
            <div class="status-dot"></div>
            <span style="font-size:12px; color:var(--text-secondary);">实时连接</span>
        </div>
    </header>

    <div id="chat-container">
        <div class="empty-state" id="empty-hint">正在加载专属聊天记录...</div>
    </div>

    <footer>
        <div class="input-wrapper">
            <input type="text" id="msg-input" placeholder="发送私密消息..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
        <button id="send-btn" onclick="sendMessage()">发送</button>
    </footer>

    <script>
        const SUPABASE_URL = "https://gjvbnhyckfyqiwvwvfys.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqdmJuaHlja2Z5cWl3dnZ3ZnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDcwMTUsImV4cCI6MjEwNjg4MzAxNX0.Zs1BNoG2Y7Ju10Zp8kGBexY20HuNiM0lk-kmsWUn-gM";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const isTaoran = location.href.includes("msqiqisingular");
        const currentUser = isTaoran ? "陶然" : "齐琦";
        
        document.getElementById('user-display-name').innerText = currentUser + " 端";
        const avatarEl = document.getElementById('user-avatar');
        avatarEl.innerText = currentUser[0];
        if (currentUser === "陶然") {
            avatarEl.classList.add('taoran');
        } else {
            avatarEl.classList.add('qiqi');
            document.getElementById('send-btn').style.background = 'var(--accent-qiqi)';
        }

        const chatContainer = document.getElementById('chat-container');
        const emptyHint = document.getElementById('empty-hint');

        function formatTime(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderMessage(msg) {
            if (emptyHint) emptyHint.style.display = 'none';

            const isMe = msg.sender === currentUser;
            const row = document.createElement('div');
            row.className = `message-row ${isMe ? 'me' : 'other'}`;

            row.innerHTML = `
                <div class="sender-name">${msg.sender}</div>
                <div class="bubble">${escapeHtml(msg.content)}</div>
                <div class="time-tag">${formatTime(msg.created_at)}</div>
            `;

            chatContainer.appendChild(row);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        async function loadHistory() {
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error("读取数据库失败:", error);
                    emptyHint.innerText = "读取受限，请确保在 Supabase 中关闭了 RLS 限制";
                    return;
                }

                chatContainer.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(renderMessage);
                } else {
                    emptyHint.innerText = "暂无消息，发送第一条对话吧！";
                    chatContainer.appendChild(emptyHint);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const content = input.value.trim();
            if (!content) return;

            input.value = '';

            const { error } = await supabase
                .from('messages')
                .insert([{ content: content, sender: currentUser }]);

            if (error) {
                alert("发送失败！请检查网络或 Supabase 配置。\n错误信息: " + error.message);
            }
        }

        supabase
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderMessage(payload.new);
            })
            .subscribe();

        loadHistory();
    </script>
</body>
</html>
